services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - cluster_net

  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    networks:
      - cluster_net

  app1:
    build:
      context: ./tomcat
      dockerfile: Dockerfile
      args:
        APP_DIR: app1
    container_name: tomcat_app1
    restart: always
    hostname: app1
    depends_on:
      - postgres
      - redis
    networks:
      - cluster_net

  app2:
    build:
      context: ./tomcat
      dockerfile: Dockerfile
      args:
        APP_DIR: app2
    container_name: tomcat_app2
    restart: always
    hostname: app2
    depends_on:
      - postgres
      - redis
    networks:
      - cluster_net

  haproxy:
    image: haproxy:2.9
    container_name: haproxy_lb
    restart: always
    depends_on:
      - app1
      - app2
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
    networks:
      - cluster_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cluster_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      GF_INSTALL_PLUGINS: redis-datasource,redis-app
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
    depends_on:
      - prometheus
      - redis
    networks:
      - cluster_net

networks:
  cluster_net:
    driver: bridge
